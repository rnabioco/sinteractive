# Validate the things that can be checked without a Slurm cluster or a Rust
# toolchain: the fake-slurm test shims parse and pass shellcheck, and the
# Claude Code settings snippet is real JSON. The binary, the man page and the
# completions it generates are covered by rust.yml.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          for f in completions/sinteractive.bash scripts/*.sh tests/fake-slurm/lib.sh tests/fake-slurm/s*; do
            bash -n "$f"
            echo "ok  $f"
          done

      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck --severity=warning scripts/*.sh tests/fake-slurm/lib.sh tests/fake-slurm/s*

      - name: JSON
        run: |
          python3 -m json.tool claude/settings-snippet.json > /dev/null
          echo "ok  claude/settings-snippet.json"
