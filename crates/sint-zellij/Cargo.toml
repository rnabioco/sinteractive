[package]
name = "sint-zellij"
description = "zellij status-bar plugin for sinteractive (WASM)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The plugin is the *binary* (a WASI command: zellij calls `_start`); the
# library holds the testable rendering/state code.
[[bin]]
name = "sint-zellij"
path = "src/main.rs"

[dependencies]
sint-proto = { path = "../sint-proto" }
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
zellij-tile = "0.45"
